<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Page Not Found</title>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; background: #0d1117; color: #e6edf3; display: grid; place-items: center; min-height: 100dvh; margin: 0; padding: 1.5rem; text-align: center; }
    main { max-width: 440px; }
    h1 { font-size: 3rem; margin: 0 0 0.5rem; }
    p { color: #8b949e; line-height: 1.6; }
    a { display: inline-block; margin-top: 1.25rem; padding: 0.65rem 1.25rem; border-radius: 8px; background: #2f81f7; color: #fff; text-decoration: none; font-weight: 600; }
  </style>
</head>
<body>
  <main>
    <h1>404</h1>
    <p>The page you requested does not exist or has moved.</p>
    <a href="/">Return Home</a>
  </main>
</body>
</html>
